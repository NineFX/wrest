name: 'Start mTLS test server'
description: >
  Windows only.  Creates a client certificate in CurrentUser\My with a
  non-exportable private key, starts the two-listener TLS test server, and
  exports WREST_MTLS_URL / WREST_MTLS_THUMBPRINT for tests/mtls.rs and
  WREST_TLS_URL for the https->http redirect test in tests/real_world.rs.
  The client key is non-exportable so the mTLS handshake can only succeed
  if SChannel drives it in place.  The server certificate is added to
  CurrentUser\Root because the redirect test uses a default client, which
  validates the chain.

  Like start-httpbin, the server is left running after the job; GitHub
  runners are reaped automatically.

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '.github/ci-tools/mtls-server/go.mod'

    - name: Create client certificate in CurrentUser\My
      shell: pwsh
      timeout-minutes: 2
      run: |
        $ErrorActionPreference = 'Stop'

        # A fresh certificate per run, so a stale one from an earlier run
        # can never make the test pass.
        $cert = New-SelfSignedCertificate `
          -Subject 'CN=wrest-mtls-test-client' `
          -CertStoreLocation 'Cert:\CurrentUser\My' `
          -KeyExportPolicy NonExportable `
          -KeyUsage DigitalSignature,KeyEncipherment `
          -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.2') `
          -NotAfter (Get-Date).AddDays(1)

        $thumbprint = $cert.Thumbprint
        if (-not $thumbprint) { throw 'certificate created without a thumbprint' }
        Write-Host "created client certificate $thumbprint"

        "WREST_MTLS_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

    - name: Start mTLS server
      # Mirrors start-httpbin: build, then launch from bash with `&`.
      # `Start-Process -NoNewWindow` does NOT survive the step boundary --
      # the server was reaped before the test step ran, and the tests saw
      # ERROR_WINHTTP_CANNOT_CONNECT (12029) rather than a handshake.
      shell: bash
      timeout-minutes: 5
      run: |
        set -euo pipefail
        (cd .github/ci-tools/mtls-server && go build -o mtls-server.exe .)
        ./.github/ci-tools/mtls-server/mtls-server.exe \
          -addr 127.0.0.1:8443 \
          -redirect-addr 127.0.0.1:8444 \
          -cert-out mtls-server-cert.der \
          > mtls-server.log 2>&1 &

        # Wait for the server's own readiness line rather than probing the
        # port: a bare TCP probe logs a spurious handshake error.
        ok=0
        for _ in $(seq 1 60); do
          grep -q "mtls-server ready" mtls-server.log 2>/dev/null && { ok=1; break; }
          sleep 0.5
        done

        if [[ $ok -ne 1 ]]; then
          echo "::error::mtls-server failed to start within 30s"
          cat mtls-server.log || true
          exit 1
        fi

        echo "WREST_MTLS_URL=https://127.0.0.1:8443" >> "$GITHUB_ENV"

    - name: Trust the server certificate
      # The redirect test drives a default client, so the chain has to
      # validate; the mTLS tests disable validation and do not need this.
      #
      # LocalMachine, not CurrentUser: adding a root for the current user
      # raises a consent dialog, which on a headless runner blocks until
      # the job times out.  The machine store needs administrator rights,
      # which GitHub runners have, and prompts for nothing.  The timeout is
      # a backstop so any future prompt fails fast instead of burning the
      # job's full allowance.
      shell: pwsh
      timeout-minutes: 2
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not (Test-Path mtls-server-cert.der)) {
          throw 'mtls-server did not write its certificate'
        }
        $cert = Import-Certificate -FilePath mtls-server-cert.der `
          -CertStoreLocation 'Cert:\LocalMachine\Root'
        Write-Host "trusted server certificate $($cert.Thumbprint)"

        "WREST_TLS_URL=https://127.0.0.1:8444" >> $env:GITHUB_ENV
