name: 'Start mTLS test server'
description: >
  Windows only.  Installs Go from .github/ci-tools/mtls-server/go.mod, creates
  client certificates in CurrentUser\My with non-exportable keys, builds and
  starts mtls-server on 127.0.0.1:8443, waits for readiness, and exports
  WREST_MTLS_URL, WREST_MTLS_THUMBPRINT and WREST_MTLS_DISPOSABLE_THUMBPRINT to
  GITHUB_ENV.
  Logs mtls-server output to ./mtls-server.log, which the wait step reads for
  readiness and the downstream "Diagnose failure" step can dump.
  Note: server process is left running after the job; GH runners are
  automatically reaped.

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '.github/ci-tools/mtls-server/go.mod'

    - name: Create client certificates
      shell: pwsh
      run: |
        ./.github/ci-tools/setup-test-certs.ps1 -ClientCertificate
        ./.github/ci-tools/setup-test-certs.ps1 -DisposableCertificate

    - name: Start mTLS server
      shell: bash
      run: |
        set -euo pipefail
        (cd .github/ci-tools/mtls-server && go build -o mtls-server.exe .)
        ./.github/ci-tools/mtls-server/mtls-server.exe -addr 127.0.0.1:8443 \
          > mtls-server.log 2>&1 &

    - name: Wait for mTLS server
      shell: pwsh
      run: ./.github/ci-tools/wait-for-mtls-server.ps1
